# The Keycloak connection and the guardrail settings of the tests live in com.github.thomasdarimont.keycloak.mcp.backend.TestConfig, which
# outranks environment variables left over from a sourced examples/run-modes/env file. Only test-only extras go here.
kc-mcp.spi.tools.acme.greeting=hello from config
kc-mcp.spi.access-check.acme-ticket-checker.ticket-prefix=CHG-
kc-mcp.spi.tools.disabled-demo.enabled=false
quarkus.mcp.server.traffic-logging.enabled=false
# the Oracle integration ships without its driver and must not be loaded without it
quarkus.class-loading.removed-artifacts=io.quarkus:quarkus-jdbc-oracle,io.quarkus:quarkus-jdbc-oracle-deployment
