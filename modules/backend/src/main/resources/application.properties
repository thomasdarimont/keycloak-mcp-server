# --- MCP server -----------------------------------------------------------------------------------
quarkus.mcp.server.server-info.name=keycloak-mcp-server
# the start-up banner (src/main/resources/banner.txt) instead of the Quarkus one
quarkus.banner.path=banner.txt
keycloak-mcp.build-time=@build.timestamp@
quarkus.mcp.server.server-info.version=${quarkus.application.version:dev}
quarkus.mcp.server.server-info.instructions=Keycloak administration. Common tools are listed directly. \
For anything else call search_tools with a short description of the task, then run the tool it returns with \
execute_tool(name, arguments). Identifiers can be passed directly: users by username or id, groups by path \
(/parent/child) or name, clients by clientId; do not look ids up first, a not_found error tells you when something \
does not exist. search_tools matches English words (German and French are translated, other languages are not): write the \
query in English, e.g. "logout user" rather than "utilisateur déconnecter". When search_tools finds nothing it returns the \
categories: pick one or tell the user the request is outside this server's scope; never retry with similar words. \
Role and membership changes return the user's effective roles, so no follow-up call is needed. \
What happened to something (a user that is gone, who changed what, when) is answered by keycloak_events_admin, \
filtered by resourceType or resourcePath (users/<id>), as long as Keycloak keeps admin events: look there instead \
of reasoning it out from earlier answers. \
Pass the realm argument unless a default realm is configured. Connected through an entry URL \
/mcp/systems/<system>[/<realm>], every call is bound to that system (and realm): omit the system and realm arguments \
there, whoami's entry field shows the binding, and a default named in a schema applies to the root /mcp only. \
Never ask the user for confirmation before calling a \
destructive tool: call it and follow its answer; search hits of destructive tools and whoami say how confirmation \
works on this server. \
Prompts such as keycloak_onboard_user come with the tools they need already listed; follow them without searching. \
A forbidden error or a search hit marked allowed=false means the current caller lacks a Keycloak role: do not retry, \
tell the user which role is missing; whoami(language) explains what the caller may do, with role labels in their language.
# CORS: only needed by browser based MCP clients; the streamable HTTP transport warns when it is off.
# Defaults allow local origins; set QUARKUS_HTTP_CORS_ORIGINS to your client's origin(s) in production.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,mcp-session-id,mcp-protocol-version,last-event-id
quarkus.http.cors.exposed-headers=mcp-session-id,mcp-protocol-version
quarkus.http.cors.access-control-max-age=24H
# The traffic log writes requests and responses verbatim, passwords and client secrets included: local debugging only
# (profile shared refuses to start with it).
quarkus.mcp.server.traffic-logging.enabled=false
# DNS rebinding protection of the MCP endpoint: auto (on while the endpoint is anonymous) | on | off; Host/Origin must be
# localhost or one of kc-mcp.dns-rebinding-allowed-hosts (host[:port], e.g. mcp.internal:8081 behind a proxy).
# kc-mcp.dns-rebinding-protection=auto
# kc-mcp.dns-rebinding-allowed-hosts=
# Some MCP clients (LM Studio, Claude) send notifications/cancelled for requests the server has already answered;
# quarkus-mcp-server logs one WARN per such notification. The spec says to ignore them, so that message is demoted
# to DEBUG; everything else the handler logs stays as it is.
quarkus.log.filter."io.quarkiverse.mcp.server.runtime.McpMessageHandler".if-starts-with=Ignored unknown/completed/invalid cancel request
# Tokens are taken out of log lines and logged exceptions: Quarkus OIDC logs the whole JWT it failed to verify
# (TokenRedactingLogFilter)
quarkus.log.console.filter=redact-tokens
quarkus.log.file.filter=redact-tokens
quarkus.log.syslog.filter=redact-tokens
%dev.quarkus.mcp.server.traffic-logging.enabled=true
%dev.quarkus.mcp.server.traffic-logging.text-limit=400

# --- CIBA confirmation (off by default) ----------------------------------------------------------
# Destructive tools wait for the caller's approval on their own device: the server files an OpenID Connect CIBA
# authentication request for the caller of the MCP session and polls until they approve, decline or time out.
# Any CIBA-capable provider; see docs/ciba-confirmation.md and examples/ciba-confirm.
# kc-mcp.spi.confirmer.ciba.enabled=false
# kc-mcp.spi.confirmer.ciba.client-id=mcp-ciba           confidential client registered for CIBA (required when on)
# kc-mcp.spi.confirmer.ciba.client-secret=
# kc-mcp.spi.confirmer.ciba.client-auth=client_secret_basic   | client_secret_post
# kc-mcp.spi.confirmer.ciba.issuer=caller                 the caller token's issuer, or an issuer URL
# kc-mcp.spi.confirmer.ciba.token-issuer=                 the iss the tokens carry when the issuer above is an internal URL
# kc-mcp.spi.confirmer.ciba.tls-configuration-name=       quarkus.tls.<name> whose trust store the provider calls use (private CA)
# kc-mcp.spi.confirmer.ciba.login-hint=username           or a token claim the provider resolves users by (email, sub)
# kc-mcp.spi.confirmer.ciba.timeout-seconds=              default kc-mcp.confirm-timeout-seconds
# kc-mcp.spi.confirmer.ciba.when=always                   | without-elicitation
# kc-mcp.spi.confirmer.ciba.flow=two-step                 first call files the request and shows the number, the next
#                                                         call collects the approval | blocking (waits in the call)
# kc-mcp.spi.confirmer.ciba.number-matching=true          two-step: the device asks for the number shown in the chat
# kc-mcp.spi.confirmer.ciba.extra-parameters=true         send requester (MCP client) and operation for the device
# kc-mcp.spi.confirmer.ciba.poll-wait-seconds=5           two-step: wait for the device before answering pending
# kc-mcp.spi.confirmer.ciba.scope=openid / acr-values= / binding-message=true / binding-message-prefix=kc-mcp / requested-expiry=false

# --- Outbound HTTP -------------------------------------------------------------------------------
# Timeouts of the server's own clients: CIBA, the UI's calls to its identity providers, and the read timeout of the
# Keycloak admin client (its connect timeout is the client's built-in 15 s). 10s, 500ms, 2m or PT1M.
# kc-mcp.http.connect-timeout=10s
# kc-mcp.http.read-timeout=60s                     generous: admin calls such as a directory sync can take a while
# kc-mcp.ui.connect-timeout= / kc-mcp.ui.read-timeout=                       the UI's provider calls
# kc-mcp.spi.confirmer.ciba.connect-timeout= / ...read-timeout=             the CIBA provider calls

# --- OpenTelemetry (metrics and traces over OTLP) --------------------------------------------------
# Off until asked for: QUARKUS_OTEL_SDK_DISABLED=false plus QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4317.
# Then Quarkus reports HTTP server and JVM metrics and a trace per request, the server its own kc_mcp.* metrics: tool
# call durations (count = calls) by tool, level, outcome, via, system; policy refusals by reason; confirmation
# decisions by confirmer; CIBA requests, decisions (outcome=rejected: an approval named someone else) and pending
# approvals. No user, argument or client-supplied value becomes an attribute.
quarkus.otel.metrics.enabled=true
quarkus.otel.sdk.disabled=true
quarkus.otel.service.name=keycloak-mcp-server
# kc-mcp.metrics.include-realm=false              true: tool call metrics carry the realm (one series per realm)

# --- Extensions -----------------------------------------------------------------------------------
# Jars in the providers directory (ToolProvider, PromptProvider, AccessCheck, Confirmer, AuditListener
# implementations registered through META-INF/services) are loaded at startup, like Keycloak's providers/.
# Relative to the directory of quarkus-run.jar when packaged, else to the working directory. JVM mode only.
# kc-mcp.providers-dir=providers
# Quarkus itself only reads this directory after a re-augmentation; it is set so that the fast-jar layout
# contains an (empty) providers/ directory next to quarkus-run.jar.
quarkus.package.jar.user-providers-directory=providers
# Keeps what a re-augmentation needs in the package, so that `bin/kcmcp.sh build` can change build-time settings.
quarkus.package.jar.type=mutable-jar

# --- Profile --------------------------------------------------------------------------------------
# local (default): one person's machine. shared: a server other people reach; it then needs quarkus.oidc.tenant-enabled
# with quarkus.oidc.token.audience, kc-mcp.allowed-hosts, kc-mcp.admin.audience (with an admin issuer) and
# kc-mcp.storage.secret-key (with the database storage), and it turns the three defaults below around.
# kc-mcp.profile=local
# kc-mcp.require-caller=false                       shared: always; 401 challenge for anonymous MCP requests
# kc-mcp.confirm-fallback=flag                      shared: deny; what confirms a destructive tool without elicitation
# kc-mcp.explicit-target=off                        shared: destructive; destructive|write tools must pass system and realm
# kc-mcp.model-confirmation=auto                    what the model is told: ask (once, then confirm: true) | server (the
#                                                   server asks: elicitation, CIBA, or refuses) | auto (server when any of
#                                                   those applies, else ask). Guidance only, the server enforces either way.
# kc-mcp.model-confirmation-trusted-roles=          callers with one of these roles (realm:admin, realm-management.realm-admin)
#                                                   are told to pass confirm: true right away in ask mode
# kc-mcp.dynamic-private-hosts=allow                shared: listed; runtime-registered systems on private/loopback addresses
#                                                   need their host named literally in kc-mcp.allowed-hosts

# --- Keycloak systems (env: KC_MCP_SYSTEMS_<NAME>_*, KC_MCP_SYSTEM_DEFAULTS_*) -----------------------
# Every Keycloak is a named system, kc-mcp.systems.<name>.*; a system exists when its url is set. Settings a system
# leaves out come from kc-mcp.system-defaults.*, then from the built-in default. One system: call it "default".
# kc-mcp.systems.default.url=http://localhost:8080
# kc-mcp.systems.default.auth-realm=master           realm of the system's client or admin user (default master)
# kc-mcp.systems.default.client-id=mcp-admin
# kc-mcp.systems.default.client-secret=
# kc-mcp.systems.default.grant-type=client_credentials   | password (local dev)
# kc-mcp.systems.default.client-auth=client_secret   | private_key_jwt | none (inferred from what is configured)
# kc-mcp.systems.default.username=admin              (password grant, e.g. with client-id admin-cli)
# kc-mcp.systems.default.password=admin
# kc-mcp.systems.default.default-realm=              makes the realm argument optional for this system
# kc-mcp.systems.default.allowed-realms=             csv allow-list of this system's realms
# kc-mcp.systems.default.trusted-issuers=            other issuers whose caller tokens the server may hand to this system:
#                                                    a realm URL (.../realms/demo) for that realm, a base URL for all realms
#                                                    (default: none); whether Keycloak accepts them is Keycloak's configuration
# kc-mcp.systems.default.issuer=                     the realm issuer as Keycloak states it, when url is internal
# kc-mcp.systems.default.version=26.8.2              when the server info is not readable
# kc-mcp.systems.default.access.<check>.enabled=     which access checks govern this system: switched on or off,
# kc-mcp.systems.default.access.<check>.order=       reordered, configured (...access.<check>.<key>, e.g.
#                                                    ...access.authorization.authzen.url); over kc-mcp.spi.access-check.*
#                                                    (docs/access-checks.md)
# kc-mcp.systems.default.realms.<realm>.*            one realm: realm-id, display-name, description, access.* over the
#                                                    system's
# kc-mcp.system-defaults.<the same keys>             shared by every system that does not set its own (not url, not
#                                                    authorization)
# kc-mcp.default-system=                             the system used when the argument is omitted: this one, else the
#                                                    only one, else "default"; the OIDC default tenant follows it
# kc-mcp.jwt.key-file=/path/to/private-key.pem      (private_key_jwt; PKCS#8 PEM, or jwt.keystore-file + key-alias)
# kc-mcp.jwt.algorithm=RS256
# dev mode: the Keycloak of the examples
%dev.kc-mcp.systems.default.url=http://localhost:8080
# kc-mcp.dynamic-systems=false                     let KeycloakSystemRepository extensions add systems at runtime
# kc-mcp.systems-file=                              JSON file of the built-in file repository ({"systems": [...]}), see docs/systems.md
# kc-mcp.static-systems=true                        false: systems come from repositories only
# kc-mcp.static-systems-order=-1000                 rank of the static configuration among the repositories (lower first)
# kc-mcp.keys-dir=data/keys                         per-system private_key_jwt keys of the built-in KeyVault (see docs/systems.md)
# kc-mcp.allowed-hosts=                             [scheme://]host[:port] patterns the Keycloak URLs must match, e.g. *.example.com,localhost:8080
# kc-mcp.explanations=auto                          admins | users | auto: for whom a refusal is worded (config details or plain)
# delegation: off (default, server credentials) | forward (the caller's token is sent to the Admin API) | exchange (the
#   caller's token is exchanged for a delegated token, actor = this client; Keycloak 26.8 token-exchange-delegation)
kc-mcp.delegation=off
kc-mcp.read-only=false
kc-mcp.tool-exposure=hybrid
kc-mcp.hot-tools=keycloak_user_search,keycloak_user_get,keycloak_realm_get_config,keycloak_server_info
kc-mcp.search-limit-default=5
kc-mcp.result-max-items=100

# --- Database storage (optional, module storage) --------------------------------------------------
# With a datasource configured, Keycloak systems (kc-mcp.dynamic-systems=true), private_key_jwt keys, secrets and
# audit events are kept in the database; without one the server runs on the static configuration alone. The
# schema is created and migrated by Liquibase at startup. The database kind is fixed when the server is built:
# h2 (embedded, the default) or `./mvnw package -Ppostgresql` (the Maven property storage.db-kind); a distribution
# changes it with `bin/kcmcp.sh build --db=<kind>`.
quarkus.datasource.db-kind=@storage.db-kind@
# quarkus.datasource.jdbc.url=jdbc:h2:file:./data/kc-mcp          (env QUARKUS_DATASOURCE_JDBC_URL)
# quarkus.datasource.username=
# quarkus.datasource.password=
# kc-mcp.storage.enabled=                           on when a jdbc url is configured; set to force it either way
# kc-mcp.storage.secret-key=                        encrypts private keys and secrets at rest (openssl rand -base64 32)
# kc-mcp.storage.previous-secret-keys=              rotation: keys that still decrypt; rows are rewritten under secret-key at
#                                                   startup and via POST /admin/storage/rekey, then drop the old key here
# kc-mcp.spi.audit-scrubber.pii.pseudonym-key=      HMAC key of the audit pseudonyms (default: secret-key, which a rotation changes)
# kc-mcp.spi.<system-repository|key-vault|audit-listener|session-store|approval-store>.db.enabled
#                                                   switch one of the stores off (approvals: the CIBA confirmer's pending requests)
# kc-mcp.spi.audit-listener.db.retention-days=                audit events older than this are deleted at startup and hourly; unset keeps all
# kc-mcp.spi.key-vault.db.retired-key-grace-seconds=3600   a rotated-away key stays in the JWKS this long (other instances)
# Several instances on one database need the PostgreSQL build (embedded H2 is one instance), the same secret-key, and
# see each other's systems within kc-mcp.spi.system-repository.db.cache-seconds, key rotations within a token lifetime.

# --- Instance roles -------------------------------------------------------------------------------
# Several instances on one database may split roles: MCP-facing ones with the admin API off, and one admin instance
# on the internal network with the admin API (and UI) on and the MCP endpoint off; its /mcp answers a plain 404.
# kc-mcp.mcp.enabled=true

# --- Admin API (off by default) -------------------------------------------------------------------
# PUT /admin/systems/<alias> registers a Keycloak system in the database storage (above) at runtime, creates its
# private_key_jwt key in the KeyVault and answers with the JWKS URL for the Keycloak client; GET/DELETE as usual,
# POST /admin/systems/<alias>/signing-key rotates the key. PUT /admin/secrets/<name> stores a secret in the database
# vault for systems to reference as vault:<name>. Callers present `Authorization: Bearer ...`: preferably an access
# token of the trusted issuer carrying the role (a person's by authorization code, a service account's by client
# credentials, so Keycloak governs access, expiry and revocation); the static token is for bootstrapping and automation.
# kc-mcp.admin.enabled=false
# kc-mcp.admin.token=                               (env KC_MCP_ADMIN_TOKEN) static token for automation
# kc-mcp.admin.issuer=                              realm URL of the OAuth server whose access tokens are accepted
# kc-mcp.admin.audience=                            audience such a token must carry (unset: any)
# kc-mcp.admin.role=realm:admin                     role such a token must carry (realm:<role> or <client>.<role>)
# kc-mcp.admin.allow-new-systems=true               false: known systems stay manageable, new aliases answer 403
# kc-mcp.admin.openapi=true                         false: /q/openapi and /q/swagger-ui answer 404
# The API is described by META-INF/openapi.yaml, served at /q/openapi (YAML; ?format=json) with Swagger UI at
# /q/swagger-ui, whether the API is on or not; the document is written by hand, so the MCP and UI endpoints are not
# scanned into it. Both are build-time choices of Quarkus, kc-mcp.admin.openapi switches them off at runtime.
mp.openapi.scan.disable=true
quarkus.swagger-ui.always-include=true
# Swagger UI's "Authorize" offers what is configured (AdminOpenApiFilter): the static token, the issuer's login (PKCE);
# Quarkus's own guess from the OIDC extension (a scheme named SecurityScheme) stays out
quarkus.smallrye-openapi.auto-add-security=false
quarkus.swagger-ui.oauth-use-pkce-with-authorization-code-grant=true

# --- Management UI (off by default) ---------------------------------------------------------------
# Lit SPA under src/main/resources/frontend (Quarkus Web Bundler, no Node) at /ui with its BFF under /bff: the server is
# the OIDC relying party (authorization code flow with PKCE), the browser gets an HttpOnly, Secure session cookie
# holding only an opaque id, the tokens live in the database (kc_mcp_user_session, encrypted like the other secrets).
# Needs the database storage and HTTPS (below). Sign in: GET /bff/login[?idp=<alias>] -> /ui/, sign out: GET /bff/logout,
# who am I: GET /bff/me, the API: GET|PUT /bff/api/systems[/{alias}] (kc-mcp.admin.role required, as for the admin API).
# empty in a -Pdist build, which has the bundle as a jar instead of the extension
@web-bundler.web-root.setting@
# kc-mcp.ui.enabled=false
# kc-mcp.ui.issuer=                                 realm users log in at; default kc-mcp.admin.issuer, else the auth realm
# kc-mcp.ui.client-id=keycloak-mcp-ui               public PKCE client in that realm; redirect URI <server>/bff/login,
#                                                   post logout redirect URI <server>/ui/*
# kc-mcp.ui.client-secret=                          set for a confidential client
# kc-mcp.ui.tls-configuration-name=                 quarkus.tls.<name> trust store for the server's own calls to the providers
#                                                   (discovery, keys, session checks); the login uses quarkus.oidc.tls.*
# kc-mcp.ui.session-age-extension=PT30M            how long past its ID token's expiry a session is still renewed with
#                                                   the refresh token (the provider's SSO idle timeout)
# kc-mcp.ui.idps.<alias>.issuer / client-id / client-secret / display-name / session-age-extension / hide-on-login-page
#                                                   several identity providers: one login button and tenant each
#                                                   (kc-mcp-ui-<alias>); env KC_MCP_UI_IDPS_<ALIAS>_ISSUER. A hidden
#                                                   provider is off the login page; its users sign in through
#                                                   /bff/login?idp=<alias>
# Session check: POST /bff/check-session (the UI calls it when its tab becomes visible) redeems the refresh token at
# the provider: proves the SSO session still exists, extends it, renews the stored tokens and the cookie; a session
# that ended elsewhere answers 401 and loses its row.
# Back-channel logout: the provider posts logout tokens to <server>/bff/backchannel-logout (one URL for every
# provider: the token's issuer and audience pick it); the sessions with that issuer + sid (or sub) are deleted at once.
# Keycloak: client setting "Backchannel logout URL", "Backchannel logout session required" on.
# Login and logout need a session (Quarkus OIDC starts the code flow for /bff/login); so does the API, where a browser
# request without a session (X-Requested-With: JavaScript) gets 499 instead of a redirect.
quarkus.http.auth.permission.bff.paths=/bff/login,/bff/logout,/bff/api/*,/bff/check-session
quarkus.http.auth.permission.bff.policy=authenticated
# Several instances: the state cookie of the code flow is encrypted with a key generated at startup unless set
# (QUARKUS_OIDC_KC_MCP_UI_<ALIAS>_AUTHENTICATION_STATE_SECRET, 32+ characters), so that any instance can finish a
# login another one started. Behind a TLS terminating proxy: quarkus.http.proxy.proxy-address-forwarding=true.

# --- HTTPS (the UI's session cookie is Secure) ----------------------------------------------------
# kc-mcp.https-certificate-file and the other kc-mcp.https-* options set the same properties (docs/tls.md).
# Local certificates: etc/mkcert.sh writes .certs/localhost.pem and .certs/localhost-key.pem with mkcert (trusted by
# the local browsers); configure them with the TLS registry, the server then listens on https://localhost:8443 too.
# quarkus.tls.key-store.pem.ui.cert=.certs/localhost.pem           (env QUARKUS_TLS_KEY_STORE_PEM_UI_CERT)
# quarkus.tls.key-store.pem.ui.key=.certs/localhost-key.pem        (env QUARKUS_TLS_KEY_STORE_PEM_UI_KEY)
quarkus.http.ssl-port=8443
# http stays on for MCP clients and the admin API; "redirect" sends everything to https, "disabled" turns http off
quarkus.http.insecure-requests=enabled

# --- Caller authentication (OIDC on the MCP endpoint) ---------------------------------------------
# Off by default: the endpoint is anonymous and every admin call uses the server's own credentials.
# QUARKUS_OIDC_TENANT_ENABLED=true makes the endpoint verify bearer tokens of the auth realm; together with
# KC_MCP_DELEGATION=forward (or KC_MCP_REQUIRE_CALLER=true) unauthenticated requests get a 401 challenge pointing
# to /.well-known/oauth-protected-resource, which OAuth-capable MCP clients (LM Studio, Claude) follow to log the
# user in. See examples/run-modes/env/user-forward.env.
quarkus.oidc.enabled=true
quarkus.oidc.tenant-enabled=false
quarkus.oidc.application-type=service
# quarkus.oidc.auth-server-url                      derived from the default system (<url>/realms/<auth-realm>) unless set
quarkus.oidc.resource-metadata.enabled=${quarkus.oidc.tenant-enabled}
# MCP clients are told to ask for the scope whose audience Keycloak 26.8.2+ demands on the Admin API; the server itself
# requests it with every token and drops it when a (older) Keycloak answers invalid_scope. Blank: no scope.
# kc-mcp.admin-api-scope=kc-admin-api
quarkus.oidc.resource-metadata.scopes=${kc-mcp.admin-api-scope}
# the metadata and the challenge advertise the scheme of the request; set true behind a TLS terminating proxy
quarkus.oidc.resource-metadata.force-https-scheme=false
# quarkus.oidc.token.audience=mcp-admin                        # only accept tokens issued for this server
# quarkus.oidc.token.issuer=http://localhost:8080/realms/demo   # when the system url is an internal address
# quarkus.oidc.resource-metadata.authorization-server=http://localhost:8080/realms/demo   # and send MCP clients there
# the MCP endpoint and everything under it (the entries): the policy itself checks the path (McpEndpointPolicy), since
# absolute path patterns here would not follow quarkus.http.root-path; everything else passes it untouched
quarkus.http.auth.permission.mcp.paths=/*
quarkus.http.auth.permission.mcp.policy=kc-mcp-caller
quarkus.keycloak.devservices.enabled=false

# The MCP server itself listens on 8081 so a local Keycloak can keep 8080, and only on this machine: the local
# profile's endpoint is anonymous. Containers (Dockerfile.jvm) and the compose files bind 0.0.0.0 explicitly; do the
# same for a packaged server other machines should reach, together with kc-mcp.profile=shared.
%prod.quarkus.http.host=127.0.0.1
# Quarkus 3.38+ answers an empty 400 to every request whose Host is not a localhost name while quarkus.http.host is one,
# without a log line. The MCP endpoint has its own DNS rebinding protection (kc-mcp.dns-rebinding-protection: a logged
# 403 with the reason, off once callers authenticate), and Keycloak must reach the JWKS as host.docker.internal or by
# the machine's name for private_key_jwt, so the Quarkus filter is off; set allowed-hosts instead of this to use it.
quarkus.http.host-validation.require-localhost=false
quarkus.http.port=8081
# Tests bind a random free port, so `mvn verify` works while a dev instance occupies 8081.
%test.quarkus.http.port=0
%test.quarkus.http.test-port=0

quarkus.log.category."com.github.thomasdarimont.keycloak.mcp.audit".level=INFO
