openapi: 3.1.0
info:
  title: keycloak-mcp-server admin API
  version: "1.0"
  description: |
    Registers Keycloak systems at runtime, keeps the secrets they reference, manages the encryption of the
    database storage and reads the audit trail. Off by default: `kc-mcp.admin.enabled=true` turns it on, and it needs the database storage
    (`quarkus.datasource.jdbc.url`) with `kc-mcp.dynamic-systems=true` to have somewhere to register systems in.
    With the API off every request answers 404 `admin_api_disabled`.

    Every request carries `Authorization: Bearer ...`. Preferably an access token of the trusted `kc-mcp.admin.issuer`
    (optionally with `kc-mcp.admin.audience`) carrying `kc-mcp.admin.role` (`realm:admin` by default): a person's token
    from the authorization code flow, or a service account's from the client credentials grant, so Keycloak governs
    who administers the server. The static `kc-mcp.admin.token` is the alternative for bootstrapping and simple
    automation. Anything else is 401 with a Bearer challenge, a verified token without the role 403.
    Refusals are JSON objects with `error` (a stable code) and `message`.

    Full documentation: `docs/systems.md`, "Admin API: registering systems at runtime"; a worked example in
    `examples/dynamic-systems/`.
tags:
  - name: systems
    description: The Keycloak systems the server administers, with their signing keys and MCP entries
  - name: secrets
    description: The secrets in the key vault that systems reference as `vault:<name>`; values are never returned
  - name: storage
    description: Encryption of the database storage
  - name: audit
    description: The audit trail of tool calls kept in the database storage, read only
  - name: extensions
    description: |
      The installed extensions and their settings, read only (the settings come from the configuration): the spec
      with its texts in the `Accept-Language`, the values with confidential and undeclared ones masked, the problems
security:
  - bearer: []
paths:
  /admin/systems:
    get:
      tags: [systems]
      summary: Every known system
      description: Configured systems come with their source repository and are read-only here; registered ones can be changed.
      operationId: listSystems
      responses:
        "200":
          description: The systems
          content:
            application/json:
              schema:
                type: object
                properties:
                  systems:
                    type: array
                    items:
                      $ref: "#/components/schemas/System"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [systems]
      summary: Register or replace a system, alias in the body
      description: The same as `PUT /admin/systems/{alias}` with the alias given as `alias` (or `name`) in the body.
      operationId: registerSystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SystemRegistration"
                - type: object
                  required: [alias]
                  properties:
                    alias:
                      $ref: "#/components/schemas/Alias"
      responses:
        "200":
          description: An existing system was replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "201":
          description: A new system was registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "400": { $ref: "#/components/responses/InvalidSystem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RegistrationClosed" }
        "404": { $ref: "#/components/responses/Disabled" }
        "409": { $ref: "#/components/responses/SystemConflict" }
        "503": { $ref: "#/components/responses/NoMutableRepository" }
  /admin/systems/{alias}:
    parameters:
      - $ref: "#/components/parameters/alias"
    get:
      tags: [systems]
      summary: One system
      operationId: getSystem
      responses:
        "200":
          description: The system without its secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownSystem" }
    put:
      tags: [systems]
      summary: Register or replace a system
      description: |
        The fields of a systems file. Registered systems are service clients: `grantType` must be `client_credentials`
        (the default) with `clientAuth` `private_key_jwt` (the default) or `client_secret`. The `url` must pass
        `kc-mcp.allowed-hosts`. With `private_key_jwt` and no key configured on the server, `signingKey` says where the
        system's key comes from: `generate` creates a new pair in the vault, `existing` expects one there, and an absent
        field takes the existing key or generates one. A `clientSecret` of the form `vault:<name>` must name a secret
        the vault holds; it is resolved on every connection, so rotating the secret needs no system change.
      operationId: putSystem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemRegistration" }
            example:
              displayName: ACME Corp.
              url: https://sso.acme.example
              authRealm: master
              clientId: keycloak-mcp-server
              clientAuth: private_key_jwt
              defaultRealm: acme
              allowedRealms: [acme, acme-dev]
              signingKey: generate
      responses:
        "200":
          description: An existing system was replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "201":
          description: A new system was registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "400": { $ref: "#/components/responses/InvalidSystem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RegistrationClosed" }
        "404": { $ref: "#/components/responses/Disabled" }
        "409": { $ref: "#/components/responses/SystemConflict" }
        "503": { $ref: "#/components/responses/NoMutableRepository" }
    delete:
      tags: [systems]
      summary: Remove a registered system
      description: |
        The system leaves the mutable repository and its keys leave the vault: its JWKS answers 404, so Keycloak refuses
        assertions in its name. The client in Keycloak stays; delete it there. A new system of the same name gets a new
        id, key and JWKS URL. Configured systems cannot be removed here.
      operationId: deleteSystem
      responses:
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownSystem" }
        "409":
          description: "`system_configured`: the system is defined by a repository the admin API cannot change"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/systems/{alias}/signing-key:
    parameters:
      - $ref: "#/components/parameters/alias"
    post:
      tags: [systems]
      summary: Rotate the system's signing key
      description: |
        A new key pair for a `private_key_jwt` system; the JWKS lists the new key first and keeps the retired one for
        the grace period, Keycloak refetches the JWKS on an unknown `kid`.
      operationId: rotateSigningKey
      responses:
        "200":
          description: The system with its new key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownSystem" }
        "409":
          description: "`no_private_key_jwt`: the system authenticates otherwise; `vault_read_only`: the vault cannot create keys"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/systems/{alias}/realms:
    parameters:
      - $ref: "#/components/parameters/alias"
    get:
      tags: [systems]
      summary: The settings of the system's realms
      operationId: listRealms
      responses:
        "200":
          description: Every realm the server keeps settings for
          content:
            application/json:
              schema:
                type: object
                required: [realms]
                properties:
                  realms:
                    type: array
                    items: { $ref: "#/components/schemas/Realm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownSystem" }
  /admin/systems/{alias}/realms/{realm}:
    parameters:
      - $ref: "#/components/parameters/alias"
      - $ref: "#/components/parameters/realm"
    get:
      tags: [systems]
      summary: One realm's settings
      operationId: getRealm
      responses:
        "200":
          description: The realm's settings, secrets as `***` or their `vault:` reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Realm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`unknown_system`, or `unknown_realm`: no settings for that realm"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [systems]
      summary: Add or replace a realm's settings
      description: |
        Labels, Keycloak's id of the realm, and an access block that goes over the system's: per check its `enabled`
        and `order` win, its settings win key by key. Held to the same rules as the system's own block. Only systems of the
        admin API's repository; a system `PUT` never carries realms (400 `realms_separately`) and keeps them.
      operationId: putRealm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealmSettings" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Realm" }
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Realm" }
        "400":
          description: >-
            `invalid_realm`, `invalid_realm_name`, `unknown_secret`, `host_not_allowed`, `private_host`,
            `local_file_setting`, `unknown_access_check`, `access_check_locked`, `unknown_authorization_engine`,
            `invalid_authorization`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownSystem" }
        "409":
          description: "`system_configured`: the system comes from a repository the admin API cannot change"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [systems]
      summary: Remove a realm's settings; the system's apply to it again
      operationId: deleteRealm
      responses:
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`unknown_system` or `unknown_realm`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`system_configured`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/systems/{alias}/client-setup:
    parameters:
      - $ref: "#/components/parameters/alias"
    get:
      tags: [systems]
      summary: The Keycloak client this server needs for the system
      description: |
        The client to create in the system's authentication realm (JSON for `POST /admin/realms/<realm>/clients`), the
        roles its service account needs and a `kcadm.sh` script doing both. The server creates nothing in Keycloak.
      operationId: clientSetup
      parameters:
        - name: roles
          in: query
          description: |
            `admin` (default): the master realm's `admin` role, every realm, later ones too (`realm-admin` in another
            realm); `read` / `manage`: the view/query (and manage) roles of the `<realm>-realm` clients of `realms`
          schema: { type: string, enum: [admin, read, manage] }
        - name: realms
          in: query
          description: Comma separated realm names for `read` / `manage` in the master realm
          schema: { type: string }
        - name: credential
          in: query
          description: |
            `private_key_jwt` only. `jwks-url` (default): Keycloak fetches the keys from this server; `public-key`: the
            current key copied into the client, no connection back to this server, a rotation needs a client update
          schema: { type: string, enum: [jwks-url, public-key] }
      responses:
        "200":
          description: The client, the roles and the script
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientSetup" }
        "400":
          description: "`invalid_roles`, `invalid_credential`, `no_realms` (read/manage without realms)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownSystem" }
        "409":
          description: "`not_a_service_client`; `no_signing_key`: no key of its own to copy (credential=public-key)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/systems/{alias}/keycloak-realms:
    parameters:
      - $ref: "#/components/parameters/alias"
    get:
      tags: [systems]
      summary: The realms Keycloak lists for the system's service account
      description: |
        `GET /admin/realms` at the system's Keycloak with its credentials: what the account may see, each realm marked
        with whether this server keeps settings for it (`adopted`) and whether calls reach it (`allowed`);
        `renamedFrom` when settings with its realm id are kept under another name. `notListed`: realms known here that
        Keycloak does not list (deleted, renamed or out of the account's sight).
      operationId: keycloakRealms
      responses:
        "200":
          description: Keycloak's realms
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeycloakRealms" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownSystem" }
        "409":
          description: "`system_refused`: the server does not connect to the system's host"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            Keycloak's answer, never as 401/403 of this API: `token_refused` (the client, its key or secret),
            `admin_api_unauthorized` (the kc-admin-api scope), `admin_api_forbidden` (roles), `keycloak_unreachable`,
            `keycloak_error`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/systems/{alias}/adoption:
    parameters:
      - $ref: "#/components/parameters/alias"
    post:
      tags: [systems]
      summary: Adopt realms Keycloak lists
      description: |
        Keycloak's realm id and display name become realm settings (a new realm also gets `preset`), the realms go on
        the allowlist. Existing settings keep everything but the realm id and gain a display name they lack.
        `allRealms: true` adopts every listed realm and clears the allowlist, so later realms are reachable too. A
        selection on a system without an allowlist would restrict it: `restrict: true` is needed for that.
      operationId: adoptRealms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                realms: { type: array, items: { type: string } }
                allRealms: { type: boolean }
                restrict: { type: boolean }
                preset: { type: string }
            example: { realms: [acme, beta], restrict: true, preset: read-only }
      responses:
        "200":
          description: What was adopted
          content:
            application/json:
              schema:
                type: object
                required: [system, adopted, updated, unchanged, restricted, allowedRealms]
                properties:
                  system: { type: string }
                  adopted: { type: array, items: { type: string } }
                  updated: { type: array, items: { type: string } }
                  unchanged: { type: array, items: { type: string } }
                  restricted: { type: boolean }
                  allowedRealms: { type: array, items: { type: string } }
        "400":
          description: "`invalid_adoption`, `no_realms`, `unknown_keycloak_realm`, `unknown_preset` and the realm settings checks"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownSystem" }
        "409":
          description: "`would_restrict` (see `restrict`), `system_configured` (not a mutable system), `system_refused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Keycloak's answer to listing the realms, as for keycloak-realms
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/systems/{alias}/adoption/{realm}:
    parameters:
      - $ref: "#/components/parameters/alias"
      - $ref: "#/components/parameters/realm"
    delete:
      tags: [systems]
      summary: Give up an adopted realm
      description: |
        The realm leaves the allowlist, which ends the access, and its realm settings are removed. Keycloak is not
        touched: the client keeps its roles. A system without an allowlist reaches every realm; giving one up makes
        the allowlist the other realms Keycloak lists, and needs `restrict=true`. The last realm on an allowlist
        stays (an empty allowlist means every realm), and so does the default realm.
      operationId: unadoptRealm
      parameters:
        - name: restrict
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: The allowlist now
          content:
            application/json:
              schema:
                type: object
                required: [system, realm, settingsRemoved, restricted, allowedRealms]
                properties:
                  system: { type: string }
                  realm: { type: string }
                  settingsRemoved: { type: boolean }
                  restricted: { type: boolean }
                  allowedRealms: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`unknown_system`, `not_adopted`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`would_restrict` (see `restrict`), `last_realm`, `default_realm`, `system_configured`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Keycloak's answer to listing the realms (only with `restrict` on a system without an allowlist)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/secrets:
    get:
      tags: [secrets]
      summary: The names in the vault and the systems using each
      operationId: listSecrets
      responses:
        "200":
          description: The secrets, never a value
          content:
            application/json:
              schema:
                type: object
                properties:
                  vault:
                    type: string
                    description: Id of the key vault
                    example: db-vault
                  writable:
                    type: boolean
                    description: Whether `PUT` can store secrets in this vault
                  secrets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Secret"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Disabled" }
  /admin/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/secretName"
    get:
      tags: [secrets]
      summary: One secret's name and users
      operationId: getSecret
      responses:
        "200":
          description: The secret, never its value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/InvalidSecretName" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownSecret" }
    put:
      tags: [secrets]
      summary: Store or replace a secret
      description: |
        Systems refer to it as `vault:<name>` and pick a new value up on their next connection. Only a vault that
        stores secrets takes it: the database vault does, a file vault or a secrets manager answers 409.
      operationId: putSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  description: The secret
            example:
              value: s3cr3t
      responses:
        "200":
          description: An existing secret was replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "201":
          description: A new secret was stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400":
          description: "`invalid_secret_name`, or `invalid_secret`: the body is not `{\"value\": \"...\"}`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Disabled" }
        "409":
          description: "`vault_read_only`: this vault does not store secrets"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [secrets]
      summary: Remove a secret no system refers to
      operationId: deleteSecret
      responses:
        "204":
          description: Removed
        "400": { $ref: "#/components/responses/InvalidSecretName" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownSecret" }
        "409":
          description: "`secret_in_use`: systems still reference it; `vault_read_only`: this vault does not store secrets"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/storage:
    get:
      tags: [storage]
      summary: Encryption state of the database storage
      operationId: storageStatus
      responses:
        "200":
          description: Which key ids the stored values are under
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Disabled" }
        "503": { $ref: "#/components/responses/StorageDisabled" }
  /admin/storage/rekey:
    post:
      tags: [storage]
      summary: Re-encrypt everything under the current key
      description: |
        Rewrites every stored value that is not under `kc-mcp.storage.secret-key`, decrypting with the
        `previous-secret-keys` where needed. Idempotent; the startup pass does the same.
      operationId: rekeyStorage
      responses:
        "200":
          description: What was rewritten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RekeyResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Disabled" }
        "409":
          description: "`encryption_disabled`: no `kc-mcp.storage.secret-key` to re-encrypt with"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StorageDisabled" }
  /admin/audit:
    get:
      tags: [audit]
      summary: The audit trail, newest first unless sorted otherwise
      description: |
        One event per finished tool call (denials and reads included), filtered by the parameters given (AND) and
        paged: `next` continues after the page's last event, so new events arriving meanwhile do not shift the pages.
        Arguments hold what the `pii` audit scrubber let through when the event was written; secrets were redacted
        before.
      operationId: searchAudit
      parameters:
        - name: subject
          in: query
          description: The caller's token `sub`, exactly
          schema: { type: string }
        - name: caller
          in: query
          description: The caller's name, exactly
          schema: { type: string }
        - name: traceId
          in: query
          description: The OpenTelemetry trace id of the call, exactly
          schema: { type: string }
        - name: anonymous
          in: query
          description: "`only`: calls without a caller; `exclude`: calls with one; both when left out"
          schema: { type: string, enum: [only, exclude] }
        - name: sort
          in: query
          description: "What the events are ordered by: the time, the duration or the caller's name"
          schema: { type: string, enum: [when, took, caller], default: when }
        - name: order
          in: query
          description: "`desc` (newest, slowest, Z first) or `asc`"
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: system
          in: query
          description: The system alias
          schema: { type: string }
        - name: realm
          in: query
          description: The realm
          schema: { type: string }
        - name: tool
          in: query
          description: "The tool name, e.g. `keycloak_user_delete`"
          schema: { type: string }
        - name: level
          in: query
          description: The tool's level
          schema: { type: string, enum: [READ, WRITE, DESTRUCTIVE] }
        - name: outcome
          in: query
          description: "`ok`, `error` for every refusal and failure, or one error code such as `access_denied`"
          schema: { type: string }
        - name: from
          in: query
          description: Earliest moment, inclusive
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Latest moment, exclusive
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: Page size, 50 by default
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
          description: "The `next` of the previous page, asked for with the same `sort` and `order`"
          schema: { type: string }
        - name: args
          in: query
          description: "Include the arguments of every event; without it an event only carries `hasArgs`"
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  next:
                    type: [string, "null"]
                    description: The cursor of the next page; null on the last
                  total:
                    type: integer
                    format: int64
                    description: How many events the filter matches on all pages together
        "400":
          description: "`invalid_query`: a parameter out of range or unreadable"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Disabled" }
        "503": { $ref: "#/components/responses/StorageDisabled" }
  /admin/audit/{id}:
    get:
      tags: [audit]
      summary: One audit event with its arguments
      description: |
        Arguments may hold personal data (what the `pii` audit scrubber let through), so the list leaves them out
        unless asked with `args=true`; this hands them out one event at a time.
      operationId: auditEvent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`unknown_event`: no event with that id; `admin_api_disabled`: the API is off"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StorageDisabled" }
  /admin/audit/values/{field}:
    get:
      tags: [audit]
      summary: Completions for the filters of the audit trail
      description: |
        The distinct values of one field recorded in the audit trail that contain a text (case-insensitive), in
        order, at most 20.
      operationId: auditValues
      parameters:
        - name: field
          in: path
          required: true
          schema: { type: string, enum: [caller, system, realm, tool] }
        - name: containing
          in: query
          description: Text the values contain; empty for the first values
          schema: { type: string }
      responses:
        "200":
          description: The values
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`unknown_field`: no completions for that field; `admin_api_disabled`: the API is off"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StorageDisabled" }
  /admin/extensions:
    get:
      tags: [extensions]
      summary: The installed extensions
      description: Every extension of every extension point, with its status and how many problems its settings have.
      operationId: listExtensions
      responses:
        "200":
          description: The extensions, by extension point, then order and id
          content:
            application/json:
              schema:
                type: object
                required: [extensions]
                properties:
                  extensions:
                    type: array
                    items: { $ref: "#/components/schemas/ExtensionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Disabled" }
  /admin/extensions/{spi}/{id}:
    parameters:
      - name: spi
        in: path
        required: true
        description: The extension point, as in `kc-mcp.spi.<spi>.<id>.*`
        schema: { type: string, example: confirmer }
      - name: id
        in: path
        required: true
        description: The extension's id, kebab-case
        schema: { type: string, example: ciba }
    get:
      tags: [extensions]
      summary: One extension's settings
      description: |
        The spec (settings, groups, conditions) with its texts in the language of `Accept-Language` (English where
        a bundle has none), the values as configured (confidential ones as `******`, undeclared ones always masked),
        the settings the server handles itself (`enabled`, `required`, ...) and the problems the startup checks see.
      operationId: getExtension
      parameters:
        - name: Accept-Language
          in: header
          required: false
          schema: { type: string, example: "de-CH, de;q=0.8" }
      responses:
        "200":
          description: The extension's settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtensionConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`unknown_extension`: no such extension installed; or `admin_api_disabled`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Preferably an access token of `kc-mcp.admin.issuer` carrying `kc-mcp.admin.role` (a user's by authorization code, a service account's by client credentials); the static `kc-mcp.admin.token` for bootstrapping and automation
  parameters:
    alias:
      name: alias
      in: path
      required: true
      description: The system's name
      schema: { $ref: "#/components/schemas/Alias" }
    realm:
      name: realm
      in: path
      required: true
      description: The realm's name in Keycloak
      schema:
        type: string
        maxLength: 255
    secretName:
      name: name
      in: path
      required: true
      description: The secret's name; may contain `/`
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$"
        example: acme/client-secret
  schemas:
    Alias:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      example: acme
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: A stable code, e.g. `unknown_system`, `invalid_system`, `registration_closed`
        message:
          type: string
          description: What went wrong, for the caller
    SystemRegistration:
      type: object
      description: The fields of a systems file (`docs/systems.md`)
      required: [url]
      properties:
        displayName:
          type: string
          description: A name for people, shown to the model with the system
        description:
          type: string
          description: What the system is, shown to the model with the system
        url:
          type: string
          format: uri
          description: Base URL of the Keycloak including its context path; must pass `kc-mcp.allowed-hosts`
          example: https://sso.acme.example
        issuer:
          type: string
          format: uri
          description: The issuer of the system's own tokens when it differs from `url` (a Keycloak behind a different public hostname)
        authRealm:
          type: string
          default: master
          description: The realm the server's client lives in
        grantType:
          type: string
          enum: [client_credentials]
          default: client_credentials
          description: Registered systems are service clients; other grants answer 400 `grant_not_supported`
        clientAuth:
          type: string
          enum: [private_key_jwt, client_secret]
          default: private_key_jwt
        clientId:
          type: string
          default: keycloak-mcp-server
        clientSecret:
          type: string
          description: With `client_secret`; a literal, or `vault:<name>` for a secret the vault holds
        defaultRealm:
          type: string
          description: The realm tools act on when the call names none
        allowedRealms:
          type: array
          items: { type: string }
          description: The realms the server may administer; empty means every realm
        trustedIssuers:
          type: array
          items:
            type: string
            format: uri
          description: Issuers whose user tokens this system accepts besides its own; a realm URL names one realm, a base URL every realm of that Keycloak
        version:
          type: string
          description: The Keycloak version when the server should not discover it
          example: "26.8.2"
        signingKey:
          type: string
          enum: [generate, existing]
          description: With `private_key_jwt`, where the key comes from; absent takes the existing key, else generates one
        access:
          $ref: "#/components/schemas/Access"
        tools:
          $ref: "#/components/schemas/Tools"
        preset:
          type: string
          description: The preset the system's `access` goes over (its own, else the server's)
        presets:
          type: object
          description: The system's own presets by name
          additionalProperties:
            $ref: "#/components/schemas/Preset"
    Access:
      type: object
      description: >-
        The access checks that govern the tool calls, by check id, over the server's
        `kc-mcp.spi.access-check.<id>.*` (a realm's over its system's, key by key; `docs/access-checks.md`). An entry
        for a check the server does not have answers 400 `unknown_access_check`, one for a check the operator locked
        400 `access_check_locked`. Whatever the check, URL-valued settings must pass `kc-mcp.allowed-hosts` and the
        private-host rule, and settings ending in `File` answer 400 `local_file_setting`.
      properties:
        authorization:
          $ref: "#/components/schemas/Authorization"
      additionalProperties:
        $ref: "#/components/schemas/CheckEntry"
      example:
        self-protection: { order: 10, mode: confirm }
        group-scope: { enabled: false }
    Preset:
      type: object
      description: >-
        A named set of settings: `extends` names one other preset (the system's, else the server's), whose settings it
        goes over; `access` holds access check entries. Other keys answer 400. A cycle answers 400 `preset_cycle`, an
        unknown name `unknown_preset`.
      additionalProperties: false
      properties:
        extends:
          type: string
        access:
          $ref: "#/components/schemas/Access"
        tools:
          $ref: "#/components/schemas/Tools"
    Tools:
      type: object
      description: >-
        Tool restrictions over the server's `kc-mcp.read-only`, `allowed-tools`, `denied-tools` and
        `allowed-categories`, which they can only narrow; among presets, system and realm the most specific key wins.
        Unknown tools answer 400 `unknown_tool`, unknown categories `unknown_category`.
      additionalProperties: false
      properties:
        readOnly: { type: boolean, description: Only tools that read }
        allowed:
          type: array
          items: { type: string }
          description: Only these tools (with or without the `keycloak_` prefix)
        denied:
          type: array
          items: { type: string }
          description: Never these tools
        categories:
          type: array
          items: { type: string }
          description: Only tools of these categories
        confirm:
          type: array
          items: { type: string }
          description: These tools need confirmation there, as destructive ones do
        confirmWrites:
          type: boolean
          description: Every tool that changes Keycloak needs confirmation there
        unlisted:
          type: string
          enum: [allow, read, deny]
          description: What happens to the tools `allowed` does not name; unset, `deny` with `allowed`, else `allow`
    CheckEntry:
      type: object
      description: One check's entry; its own settings beside `enabled` and `order`
      properties:
        enabled:
          type: boolean
          description: Whether the check runs here; absent follows the level below (realm, system, the server's `default`)
        order:
          type: integer
          description: Where it runs, lower first; absent follows the level below, then the check's own order
      additionalProperties: true
    Authorization:
      type: object
      description: >-
        Whether tool calls are evaluated by the server's authorization engines, and per engine the settings that differ
        from the engine's own (`kc-mcp.spi.authorization-engine.<id>.*`, `docs/authzen.md`). Every other key names an
        engine by its id and holds its settings; naming engines limits the calls to them, naming none hands them to
        every engine the server has. An engine the server does not have answers 400 `unknown_authorization_engine`.
        Whatever the engine, URL-valued settings must pass `kc-mcp.allowed-hosts` and the private-host rule, settings
        ending in `File` answer 400 `authorization_local_file`, and settings an engine finds wrong 400
        `invalid_authorization`.
      properties:
        enabled:
          type: boolean
          description: Evaluate the calls; absent follows the system (for a realm), else each engine's `default` (off)
        order:
          type: integer
          description: Where the authorization check runs among the access checks
        authzen:
          $ref: "#/components/schemas/AuthZenSettings"
      additionalProperties:
        type: object
        description: A vendor engine's settings, by the engine's id
        additionalProperties:
          oneOf:
            - type: string
            - type: number
            - type: boolean
    AuthZenSettings:
      type: object
      description: The `authzen` engine's settings over `kc-mcp.spi.authorization-engine.authzen.*`
      additionalProperties:
        description: Further settings in camelCase (`connectTimeout`, `tlsConfigurationName`, a client authentication method's own)
        oneOf:
          - type: string
          - type: number
          - type: boolean
      properties:
        url:
          type: string
          description: The PDP's evaluation endpoint; may contain `{system}` and `{realm}`
          example: https://pdp.example.com/access/v1/evaluation
        auth:
          type: string
          enum: [none, header, client-credentials, system-client]
          description: "`system-client`: a token for the PDP from the system's own Keycloak, requested with the system's own client and `scope`"
        headerName: { type: string, default: Authorization }
        headerValue:
          type: string
          description: A literal (stored encrypted, shown as `***`) or `vault:<name>`
        tokenUrl: { type: string, format: uri }
        clientId: { type: string }
        clientAuth:
          type: string
          description: "`client_secret_basic` (default), `client_secret_post`, `private_key_jwt` (signed with the system's own key) or an extension's"
        clientSecret:
          type: string
          description: A literal (stored encrypted, shown as `***`) or `vault:<name>`
        scope: { type: string }
        onError:
          type: string
          enum: [deny, allow]
        sendArgs: { type: boolean }
    RealmSettings:
      type: object
      description: One realm of a system, on top of the system's settings
      properties:
        realmId:
          type: string
          description: Keycloak's internal id of the realm, which stays when the realm is renamed
        displayName: { type: string }
        description: { type: string }
        access:
          $ref: "#/components/schemas/Access"
        tools:
          $ref: "#/components/schemas/Tools"
        preset:
          type: string
          description: The preset the realm's `access` goes over
    Realm:
      allOf:
        - $ref: "#/components/schemas/RealmSettings"
        - type: object
          required: [name, system, entry]
          properties:
            name: { type: string, description: The realm's name in Keycloak }
            system: { $ref: "#/components/schemas/Alias" }
            entry:
              type: string
              description: The MCP entry of the realm
              example: /mcp/systems/acme/sandbox
    System:
      type: object
      description: A system without its secrets (`clientSecret`, `password` and the authorization secrets, its realms' too, show `***`, or their `vault:` reference)
      required: [alias, url, authRealm, grantType, clientAuth, allowedRealms, entries]
      properties:
        alias: { $ref: "#/components/schemas/Alias" }
        displayName: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        issuer: { type: string, format: uri }
        authRealm: { type: string }
        grantType:
          type: string
          example: client_credentials
        clientAuth:
          type: string
          example: private_key_jwt
        clientId: { type: string }
        clientSecret:
          type: string
          description: "`***` or `vault:<name>`"
        username: { type: string }
        password:
          type: string
          description: "`***` or `vault:<name>`"
        defaultRealm: { type: string }
        allowedRealms:
          type: array
          items: { type: string }
        trustedIssuers:
          type: array
          items: { type: string }
        version: { type: string }
        access:
          $ref: "#/components/schemas/Access"
        tools:
          $ref: "#/components/schemas/Tools"
        preset:
          type: string
          description: The preset the system's `access` goes over (its own, else the server's)
        presets:
          type: object
          description: The system's own presets by name
          additionalProperties:
            $ref: "#/components/schemas/Preset"
        realms:
          type: object
          description: The settings of the system's realms by name (`/admin/systems/{alias}/realms`)
          additionalProperties:
            $ref: "#/components/schemas/RealmSettings"
        source:
          type: string
          description: Id of the repository defining the system; configured ones are read-only here
          example: db
        createdAt:
          type: string
          format: date-time
          description: From repositories that keep it (the database)
        updatedAt:
          type: string
          format: date-time
        signingKey:
          $ref: "#/components/schemas/SigningKey"
        entries:
          type: array
          description: The MCP entries of the system, `/mcp/systems/<alias>` and one per realm
          items: { type: string }
          example: ["/mcp/systems/acme", "/mcp/systems/acme/acme"]
    KeycloakRealms:
      type: object
      required: [system, url, authRealm, restricted, count, realms, notListed]
      properties:
        system: { type: string }
        url: { type: string }
        authRealm: { type: string }
        clientId: { type: string }
        restricted: { type: boolean, description: The system has an allowlist }
        count: { type: integer }
        realms:
          type: array
          items:
            type: object
            required: [name, id, adopted, allowed]
            properties:
              name: { type: string }
              id: { type: string }
              displayName: { type: string }
              enabled: { type: boolean }
              adopted: { type: boolean }
              allowed: { type: boolean }
              renamedFrom: { type: string }
        notListed:
          type: array
          items:
            type: object
            required: [name, settings, allowed]
            properties:
              name: { type: string }
              settings: { type: boolean }
              allowed: { type: boolean }
              realmId: { type: string }
    ClientSetup:
      type: object
      required: [system, url, realm, clientId, clientAuth, credential, client, roles, script, notes]
      properties:
        system: { type: string }
        url: { type: string }
        realm: { type: string, description: Where the client goes (the system's authRealm) }
        clientId: { type: string }
        clientAuth: { type: string }
        credential: { type: string, enum: [jwks-url, public-key, client-secret] }
        client: { type: object, description: "JSON for POST /admin/realms/<realm>/clients", additionalProperties: true }
        roles:
          type: object
          properties:
            mode: { type: string }
            serviceAccount: { type: string }
            realmRoles: { type: array, items: { type: string } }
            clientRoles: { type: object, additionalProperties: { type: array, items: { type: string } } }
        script: { type: string, description: "kcadm.sh script: the client, the roles and the role scope" }
        notes: { type: array, items: { type: string } }
    SigningKey:
      type: object
      description: The `private_key_jwt` key Keycloak verifies the server's tokens with; the Keycloak client gets `jwksUrl`
      properties:
        configured:
          type: boolean
          description: The server-wide key from `kc-mcp.jwt.key-file` rather than a per-system one
        kid:
          type: string
        algorithm:
          type: string
          example: RS256
        vault:
          type: string
          description: Id of the key vault holding a per-system key
        jwksPath:
          type: string
          description: |
            By the system's id for a stored system (a new system of the same name gets another), by its name for a
            configured one with a provisioned key
          example: /auth/keys/3f0c9a52-6d1e-4b8a-9f2e-0c7d5b1a4e93/jwks.json
        jwksUrl:
          type: string
          format: uri
          description: Built from the scheme and host the request came in on (`X-Forwarded-*` first)
    Secret:
      type: object
      required: [name, reference, vault, usedBy]
      properties:
        name: { type: string }
        reference:
          type: string
          description: How systems refer to it
          example: vault:acme/client-secret
        vault:
          type: string
          description: Id of the key vault
        usedBy:
          type: array
          description: Aliases of the systems referencing it
          items: { type: string }
    StorageStatus:
      type: object
      required: [encryption, keyIds]
      properties:
        encryption:
          type: boolean
          description: Whether `kc-mcp.storage.secret-key` is set
        currentKeyId:
          type: string
          description: Id of the key new values are written under
        previousKeys:
          type: boolean
          description: Whether `kc-mcp.storage.previous-secret-keys` holds rotated-away keys
        keyIds:
          type: object
          description: Per table, how many values are under which key id (`plain` for unencrypted ones)
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
              format: int64
          example:
            systems: { "k1": 3 }
            signing_keys: { "k1": 2, "k0": 1 }
    AuditEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        tool: { type: string }
        level: { type: string, enum: [READ, WRITE, DESTRUCTIVE] }
        system: { type: [string, "null"] }
        realm: { type: [string, "null"] }
        outcome: { type: string, description: "`ok` or the error code" }
        message: { type: [string, "null"] }
        traceId: { type: [string, "null"], description: "The OpenTelemetry trace the call ran in, 32 hex digits; null when tracing was off" }
        spanId: { type: [string, "null"], description: "The span of that trace, 16 hex digits" }
        hasArgs: { type: boolean, description: Whether arguments were recorded }
        args: { type: object, description: "The arguments, secrets replaced by `***`; only with `args=true` or for one event" }
        via: { type: [string, "null"], description: "`direct` or `execute_tool`" }
        caller:
          type: object
          properties:
            subject: { type: [string, "null"] }
            name: { type: [string, "null"] }
            realm: { type: [string, "null"] }
            delegated: { type: boolean, description: Keycloak was called with the caller's own token }
        client: { type: [string, "null"], description: The MCP client's name }
        connectionId: { type: [string, "null"] }
        durationMs: { type: integer, format: int64 }
    RekeyResult:
      type: object
      required: [currentKeyId, rewritten, remaining]
      properties:
        currentKeyId: { type: string }
        rewritten:
          type: object
          description: Values rewritten per table
          properties:
            systems: { type: integer, format: int64 }
            signingKeys: { type: integer, format: int64 }
            secrets: { type: integer, format: int64 }
            userSessions: { type: integer, format: int64 }
        remaining:
          type: object
          description: Key ids values are still under because no configured key decrypts them, with counts
          additionalProperties:
            type: integer
            format: int64
    ExtensionSummary:
      type: object
      required: [spi, id, status, origin, className, configurable]
      properties:
        spi: { type: string, example: confirmer }
        id: { type: string, example: ciba }
        displayName: { type: string }
        description: { type: string }
        status:
          type: string
          description: "`active` or `selected` when it takes part; `disabled`, `not supported`, `not selected`; `available` when nothing asked for it yet"
        origin:
          type: string
          description: "`built-in`, or the jar of the providers directory"
        className: { type: string }
        configurable:
          type: boolean
          description: Whether it declares settings
        errors: { type: integer, description: "Problems of severity ERROR (list only)" }
        warnings: { type: integer, description: "Problems of severity WARNING (list only)" }
    ExtensionConfig:
      allOf:
        - $ref: "#/components/schemas/ExtensionSummary"
        - type: object
          required: [keyPrefix, envPrefix, properties, groups, server, undeclared, problems]
          properties:
            keyPrefix: { type: string, example: kc-mcp.spi.confirmer.ciba. }
            envPrefix: { type: string, example: KC_MCP_SPI_CONFIRMER_CIBA_ }
            properties:
              type: array
              items: { $ref: "#/components/schemas/ConfigProperty" }
            groups:
              type: array
              items: { $ref: "#/components/schemas/ConfigGroup" }
            server:
              type: object
              description: Settings the server handles itself (`enabled`, `required`; `default`, `order`, `locked` of an access check)
              additionalProperties: { type: string }
            undeclared:
              type: object
              description: Settings that are written but not declared; their values are always masked
              additionalProperties: { type: string, example: "******" }
            problems:
              type: array
              items: { $ref: "#/components/schemas/ConfigProblem" }
    ConfigProperty:
      type: object
      required: [name, key, env, type, label, labelKey, required, confidential, appliesWhen, set]
      properties:
        name: { type: string, example: client-secret }
        key: { type: string, example: kc-mcp.spi.confirmer.ciba.client-secret }
        env: { type: string, example: KC_MCP_SPI_CONFIRMER_CIBA_CLIENT_SECRET }
        type:
          type: string
          enum: [STRING, BOOLEAN, INT, NUMBER, DURATION, URL, LIST, CHOICE, JSON]
        label: { type: string, description: In the requested language }
        labelKey: { type: string, description: The message key of the label }
        description: { type: [string, "null"] }
        descriptionKey: { type: string }
        default: { type: [string, "null"], description: As written in the configuration; masked when confidential }
        required: { type: boolean, description: While its conditions hold }
        confidential: { type: boolean }
        options:
          type: array
          description: The options of a CHOICE
          items:
            type: object
            required: [value, label, labelKey]
            properties:
              value: { type: string }
              label: { type: string }
              labelKey: { type: string }
        appliesWhen:
          type: array
          description: Conditions under which the setting matters, all of them; empty when it always does
          items:
            type: object
            required: [on, values]
            properties:
              on: { type: string, description: The setting it depends on }
              values:
                type: array
                description: The values of `on` it applies under; empty when `on` only has to be set
                items: { type: string }
        set: { type: boolean, description: Whether it is configured (the default does not count) }
        value: { type: [string, "null"], description: "As configured; `******` when confidential" }
    ConfigGroup:
      type: object
      required: [id, label, labelKey, properties]
      properties:
        id: { type: string, example: client }
        label: { type: string }
        labelKey: { type: string }
        description: { type: [string, "null"] }
        descriptionKey: { type: string }
        properties:
          type: array
          description: The names of its settings, in order
          items: { type: string }
    ConfigProblem:
      type: object
      required: [severity, code, message, args, properties]
      properties:
        severity: { type: string, enum: [ERROR, WARNING] }
        code: { type: string, description: "The message key, e.g. `config.invalid-value`", example: config.required }
        message: { type: string, description: In the requested language }
        args:
          type: object
          description: The message's named arguments; never a confidential value
          additionalProperties: { type: string }
        properties:
          type: array
          description: The settings concerned
          items: { type: string }
  responses:
    Unauthorized:
      description: "`unauthorized`: no or no acceptable bearer token; comes with a `WWW-Authenticate: Bearer` challenge"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`forbidden`: a verified token without `kc-mcp.admin.role`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Disabled:
      description: "`admin_api_disabled`: the admin API is off (`kc-mcp.admin.enabled`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnknownSystem:
      description: "`unknown_system`: no system of that alias; or `admin_api_disabled`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnknownSecret:
      description: "`unknown_secret`: no secret of that name in the vault; or `admin_api_disabled`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidSecretName:
      description: "`invalid_secret_name`: the name does not match the pattern"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidSystem:
      description: |
        `invalid_system` (malformed body or fields), `invalid_alias`, `invalid_url`, `grant_not_supported`,
        `host_not_allowed`, `private_host`, `unknown_secret` (a `vault:` reference the vault lacks),
        `no_signing_key` (`existing` but none there), `vault_read_only` (`generate` in a vault that cannot create
        keys), `invalid_signing_key`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RegistrationClosed:
      description: "`registration_closed`: `kc-mcp.admin.allow-new-systems=false` and the alias is new; or `forbidden`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SystemConflict:
      description: "`system_configured`: a repository the admin API cannot change defines the alias; `signing_key_exists`: `generate` for an alias that already has a key"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoMutableRepository:
      description: "`no_mutable_repository`: no database storage with `kc-mcp.dynamic-systems=true` to register systems in"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StorageDisabled:
      description: "`storage_disabled`: the database storage is off (`quarkus.datasource.jdbc.url`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
