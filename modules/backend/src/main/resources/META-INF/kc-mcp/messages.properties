http.tls-registry-missing={key}={value} needs the TLS registry
http.tls-unknown={key}={value} names no TLS configuration: define quarkus.tls.{value}.trust-store.*
http.tls-no-trust-store=TLS configuration '{value}' ({key}) has no trust store: set quarkus.tls.{value}.trust-store.*

# Help texts of extensions (<spi>.<id>.help-text): when to use it, what it needs.
access-check.step-up.help-text=Use it when a login of hours ago should not be enough for sensitive tools. It compares acr and auth_time of the caller's token with what you ask for, so the realm has to issue both (ACR to LoA mapping). MCP clients cannot send their user through a new login: with login=device or login=browser the server runs one itself and hands out a link, which needs a client of its own in the realm. A step-up opens the chosen tools for a time, it does not approve a single operation; use a confirmer for that.
access-check.rate-limit.help-text=Use it to bound what a runaway model or a mistaken prompt can do: it counts a caller's calls per system in a sliding window and refuses the ones beyond the maximum. With the database storage on, the limit holds for all instances together; without it, or while the database is away, each instance counts for itself.
confirmer.ciba.help-text=Use it when calls that need a confirmation should be decided by the user outside the MCP client, where a model cannot answer for them: the server starts a CIBA authentication at the provider and runs the tool only once it is approved. Needs a confidential client with the CIBA grant, and a provider that can reach the user (in Keycloak: an authentication channel).
authorization-engine.authzen.help-text=Use it when an external policy decision point should decide which calls are allowed: tool calls of the evaluated systems are sent to it as AuthZEN evaluations with the caller, the tool, the system and the realm. A PDP that cannot be reached denies the call unless on-error=allow.
