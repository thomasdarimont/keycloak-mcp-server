# English texts of the configuration problems the server reports (ConfigProblem codes); UTF-8.
# Named arguments in braces: {key} is the full key of the setting.
config.invalid-value={key} must be {expected}
config.required={key} is required
config.unknown-key={key} is not a setting of this extension and is ignored; it reads {known}
config.validation-failed=The settings could not be checked: {error}

# Names and descriptions of the extension points (<spi>.display-name, <spi>.description); one without a name shows
# as its id.
access-check.display-name=Access checks
access-check.description=Decide per tool call whether it may run, after the policy, realm and role checks and before the confirmation.
approval-store.display-name=Approval store
approval-store.description=Keeps the pending approvals of the CIBA confirmer, so the call that collects a decision finds the request an earlier call filed. One store is used.
audit-listener.display-name=Audit listeners
audit-listener.description=Receive one audit event per tool call, whatever its outcome: the log, the database, a SIEM.
audit-scrubber.display-name=Audit scrubbers
audit-scrubber.description=Remove or pseudonymize personal data in an audit event before a listener receives it.
authorization-engine.display-name=Authorization engines
authorization-engine.description=Clients of an outside policy service that decides about tool calls, such as an AuthZEN policy decision point.
authzen-customizer.display-name=AuthZEN customizers
authzen-customizer.description=Adjust the evaluation request the AuthZEN engine sends: further context, other resource types, another subject.
confirmer.display-name=Confirmers
confirmer.description=Decide whether a tool call that needs a confirmation may run: ask the user, check a ticket, apply a four-eyes rule. The first that decides wins.
issuer-policy.display-name=Caller issuer policies
issuer-policy.description=Decide whether a caller's token from one Keycloak may be used at a system. The first that decides wins.
key-generator.display-name=Signing key generator
key-generator.description=Generates the key pairs the key vault stores for private_key_jwt. One generator is used.
key-vault.display-name=Key vault
key-vault.description=Keeps the signing keys of the systems and the secrets the configuration references as vault:<name>. One vault is used.
profile-check.display-name=Profile checks
profile-check.description=Checks of the deployment at startup, next to those of the security profile; a problem stops the start.
prompts.display-name=Prompts
prompts.description=Contribute the task recipes a user can pick in their MCP client.
rate-limit-store.display-name=Rate limit store
rate-limit-store.description=Keeps the calls the rate-limit access check counts, so a limit holds across instances. One store is used.
session-store.display-name=UI session store
session-store.description=Keeps the sessions of the management UI on the server, so the browser cookie never carries a token. One store is used.
state-store.display-name=State store
state-store.description=Keeps short-lived state every instance must see, such as a step-up login under way. One store is used.
system-repository.display-name=System repositories
system-repository.description=Where Keycloak systems come from: the configuration, a file, the database, a tenant registry.
tools.display-name=Tools
tools.description=Contribute the tools the server offers to MCP clients.
