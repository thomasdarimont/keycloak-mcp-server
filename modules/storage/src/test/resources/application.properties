# Storage module tests run against a database started by Dev Services (Docker): PostgreSQL unless the build names
# another kind and its image, e.g. ./mvnw -pl modules/storage -am verify -DskipITs=false -Dit.db-kind=mariadb
# -Dit.db-image=mariadb:11.8 (docs/development.md). The datasource URL comes from Dev Services at runtime, so the
# switch is set explicitly here.
quarkus.datasource.db-kind=${it.db-kind:postgresql}
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=${it.db-image:postgres:17-alpine}
kc-mcp.storage.enabled=true
kc-mcp.storage.secret-key=test-passphrase
kc-mcp.spi.audit-listener.db.retention-days=30
kc-mcp.storage.previous-secret-keys=old-passphrase
# the entities must match what Liquibase creates (Quarkus dev mode validates the schema after boot)
quarkus.hibernate-orm.schema-management.strategy=validate
# the Oracle integration ships without its driver and must not be loaded without it
quarkus.class-loading.removed-artifacts=io.quarkus:quarkus-jdbc-oracle,io.quarkus:quarkus-jdbc-oracle-deployment
