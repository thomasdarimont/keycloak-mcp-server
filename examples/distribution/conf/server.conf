# keycloak-mcp-server for this example: users log in through their MCP client and consent to the server acting for
# them; every Admin API call runs with a delegated token Keycloak exchanges their token for (delegation mode
# exchange: sub = the user, act = the server's client), so Keycloak enforces their own roles. The server's client
# keycloak-mcp-server is the actor: it holds no admin role and authenticates with a signed JWT (private_key_jwt)
# whose public key Keycloak fetches from http://host.docker.internal:9080/.well-known/jwks.json.
#   bin/kcmcp.sh start --config conf/server.conf --config conf/systems/
quarkus.http.port=9080
# The server listens on 127.0.0.1. Docker Desktop (macOS, Windows) lets the Keycloak container reach it there as
# host.docker.internal; on Linux that name is the bridge gateway, which does not reach the loopback interface, so
# listen on every interface (the MCP endpoint still needs the user's login; the JWKS and metadata are public anyway):
# quarkus.http.host=0.0.0.0

# the Keycloak systems come from conf/systems/*.conf; these are the shared settings every system falls back to
kc-mcp.default-system=sso
kc-mcp.system-defaults.grant-type=client_credentials
kc-mcp.system-defaults.client-auth=private_key_jwt
kc-mcp.system-defaults.client-id=keycloak-mcp-server
kc-mcp.jwt.key-file=${kcmcp.home.dir}/conf/keycloak-mcp-server.pem
kc-mcp.jwt.algorithm=RS256

# the actor's service account may not read the server info, so the Keycloak version is stated (capability checks)
kc-mcp.system-defaults.version=26.8.2

# users log in; their token must be issued for this server (the audience mapper on mcp-consumer) and is exchanged
# for a delegated one. The protected resource metadata tells MCP clients to ask for the delegation scope; without
# it the user is not asked to consent and every tool answers delegation_failed.
kc-mcp.delegation=exchange
kc-mcp.mcp.oauth.enabled=true
kc-mcp.mcp.oauth.audience=keycloak-mcp-server
kc-mcp.mcp.oauth.resource-metadata.scopes=openid,delegation:client:keycloak-mcp-server
# realm admins are told to pass confirm: true right away instead of being asked first (guidance only)
kc-mcp.model-confirmation-trusted-roles=realm-management.realm-admin,realm:admin
kc-mcp.tool-exposure=hybrid

# the admin API (GET /api/admin/systems, described at /q/openapi, Swagger UI at /q/swagger-ui). This demo uses a static
# token, generated by setup.sh into the distribution's conf/kcmcp.conf (read on every start) and printed; the preferred
# way in is an access token of a trusted issuer, a person's or a service account's, carrying kc-mcp.admin.oauth.role:
#   kc-mcp.admin.oauth.issuer=http://localhost:8080/realms/master      (then the token is not needed)
# Registering systems needs the database storage (docs/storage.md): start-dev brings H2 and kc-mcp.dynamic-systems=true,
# start only reads.
kc-mcp.admin.enabled=true
