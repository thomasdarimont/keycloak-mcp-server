# keycloak-mcp-server for this example: users log in through their MCP client (forward delegation), every Admin
# API call runs with their own roles; the server's own identity is the client keycloak-mcp-server, authenticating with
# a signed JWT (private_key_jwt) whose public key Keycloak fetches from http://host.docker.internal:9080/.well-known/jwks.json.
#   bin/kcmcp.sh start --config conf/server.conf --config conf/systems/
quarkus.http.port=9080
# The server listens on 127.0.0.1. Docker Desktop (macOS, Windows) lets the Keycloak container reach it there as
# host.docker.internal; on Linux that name is the bridge gateway, which does not reach the loopback interface, so
# listen on every interface (the MCP endpoint still needs the user's login; the JWKS and metadata are public anyway):
# quarkus.http.host=0.0.0.0

# the Keycloak systems come from conf/systems/*.conf; these are the shared settings every system falls back to
kc-mcp.default-system=sso
kc-mcp.system-defaults.grant-type=client_credentials
kc-mcp.system-defaults.client-auth=private_key_jwt
kc-mcp.system-defaults.client-id=keycloak-mcp-server
kc-mcp.jwt.key-file=${kcmcp.home.dir}/conf/keycloak-mcp-server.pem
kc-mcp.jwt.algorithm=RS256

# users log in; their token must be issued for this server (the audience mapper on mcp-consumer)
kc-mcp.delegation=forward
quarkus.oidc.tenant-enabled=true
quarkus.oidc.token.audience=keycloak-mcp-server
# realm admins are told to pass confirm: true right away instead of being asked first (guidance only)
kc-mcp.model-confirmation-trusted-roles=realm-management.realm-admin,realm:admin
kc-mcp.tool-exposure=hybrid

# the admin API (GET /admin/systems, described at /q/openapi, Swagger UI at /q/swagger-ui). This demo uses a static
# token, generated by setup.sh into the distribution's conf/kcmcp.conf (read on every start) and printed; the preferred
# way in is an access token of a trusted issuer, a person's or a service account's, carrying kc-mcp.admin.role:
#   kc-mcp.admin.issuer=http://localhost:8080/realms/master      (then the token is not needed)
# Registering systems needs the database storage (docs/storage.md): start-dev brings H2 and kc-mcp.dynamic-systems=true,
# start only reads.
kc-mcp.admin.enabled=true
