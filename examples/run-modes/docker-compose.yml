# Demo stack for keycloak-mcp-server: Keycloak 26.8.2 + PostgreSQL + Mailpit (+ optional MCP server).
#
#   docker compose up -d                 # Keycloak on http://localhost:8080 (admin / admin), Mailpit on :8025
#   docker compose --profile mcp up -d --build   # also runs the MCP server from ../modules/backend/target/quarkus-app on :8081
#   docker compose down -v               # reset everything
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # token exchange delegation (the user login of env/user-login.env) needs parameterized scopes, both preview.
      # 26.8 warns about its deprecated defaults: use the v2 brokering API, drop the Twitter (OAuth 1.0a) broker
      KC_FEATURES: token-exchange-delegation,parameterized-scopes,identity-brokering-api:v2
      KC_FEATURES_DISABLED: twitter-broker
      KC_LOG_LEVEL: info
    ports:
      - "127.0.0.1:8080:8080"
      - "9000:9000"
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Keycloak fetch the MCP server's JWKS (private_key_jwt demo)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # the image has no curl; talk HTTP to the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The one setting a realm import cannot carry: the Admin Permissions grant that lets the server's client
  # keycloak-mcp act for the users who consent to it (env/user-login.env, env/shared.env).
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.8.2
    entrypoint: ["/bin/bash", "/grant-delegation.sh"]
    volumes:
      - ./init/grant-delegation.sh:/grant-delegation.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

  # Optional: the MCP server itself, built from this repository (run ../mvnw package first).
  mcp:
    profiles: ["mcp"]
    build:
      context: ../..
      dockerfile: modules/backend/src/main/docker/Dockerfile.jvm
    env_file:
      - ${KC_MCP_ENV_FILE:-env/realm-admin.env}
    environment:
      KC_MCP_SYSTEMS_DEFAULT_URL: http://keycloak:8080
      KC_MCP_JWT_KEY_FILE: /keys/mcp-jwt.pem
      # the management UI signs people in at the demo realm; the container reaches it as keycloak:8080, the browser
      # is still sent to the public address (KC_HOSTNAME)
      KC_MCP_UI_OIDC_ISSUER: http://keycloak:8080/realms/demo
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_HTTP_HOST: 0.0.0.0
    volumes:
      - ./keys:/keys:ro
      # extension jars, see README "Extension jars"
      # - ./providers:/deployments/providers:ro
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  pgdata:
