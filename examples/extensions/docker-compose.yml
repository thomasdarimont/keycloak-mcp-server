# The ACME extensions in a running server: Keycloak with the demo realm of examples/run-modes, the MCP server with the
# extension jar mounted into its providers/ directory. See README.md.
#
#   ../../mvnw -f ../../pom.xml package -DskipTests        # the server
#   ../../mvnw -f pom.xml package                          # the extension jar (target/)
#   docker compose up -d --build && ./demo.sh              # Keycloak :8093 (admin/admin), MCP :8094
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # the management UI sends browsers to the login here, while the server reaches Keycloak as keycloak:8080
      KC_HOSTNAME: http://localhost:8093
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # 26.8 warns about its deprecated defaults: use the v2 brokering API, drop the Twitter (OAuth 1.0a) broker
      KC_FEATURES: identity-brokering-api:v2
      KC_FEATURES_DISABLED: twitter-broker
    volumes:
      # realm demo: service account mcp-admin (realm-admin), users alice, bob, carol, dave, groups
      - ../run-modes/realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8093:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  mcp:
    build:
      context: ../..
      dockerfile: modules/backend/src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_HTTP_HOST: 0.0.0.0
      # realm admin: the service account mcp-admin of realm demo
      KC_MCP_SYSTEMS_DEFAULT_URL: http://keycloak:8080
      KC_MCP_SYSTEMS_DEFAULT_GRANT_TYPE: client_credentials
      KC_MCP_SYSTEMS_DEFAULT_AUTH_REALM: demo
      KC_MCP_SYSTEMS_DEFAULT_CLIENT_ID: mcp-admin
      KC_MCP_SYSTEMS_DEFAULT_CLIENT_SECRET: mcp-admin-secret
      KC_MCP_SYSTEMS_DEFAULT_DEFAULT_REALM: demo
      KC_MCP_SYSTEMS_DEFAULT_ALLOWED_REALMS: demo
      KC_MCP_TOOLS_EXPOSURE: hybrid
      # the extensions (kc-mcp.spi.<spi>.<id>.<key>)
      KC_MCP_SPI_TOOLS_ACME_COMPANY: ACME
      KC_MCP_SPI_AUDIT_LISTENER_ACME_FILE: /deployments/data/acme-audit.jsonl
      KC_MCP_SPI_ACCESS_CHECK_ACME_PROTECTED_USERS_PREFIX: svc-
      # the tenant repository needs kc-mcp.dynamic-systems; globex is a placeholder that is never reached
      KC_MCP_DYNAMIC_SYSTEMS: "true"
      # with dynamic systems no system is the default by itself: tools would require the system argument
      KC_MCP_DEFAULT_SYSTEM: default
      KC_MCP_SPI_SYSTEM_REPOSITORY_ACME_TENANTS_SYSTEMS: globex=https://sso.globex.example|globex-prod
      # the management UI, to look around: http://localhost:8094/ui/ (alice / alice-demo; carol / carol-demo as a
      # read-only viewer), with the systems, globex among them, and the audit trail of the tool calls. It needs the
      # database storage, here an H2 file in the container, and HTTPS, which dev mode lifts (its session cookie
      # drops Secure; for one person's machine only). docs/management-ui.md
      KC_MCP_UI_ENABLED: "true"
      KC_MCP_DEV_MODE: "true"
      KC_MCP_UI_OPERATOR_ROLE: realm-management.realm-admin
      KC_MCP_UI_VIEWER_ROLE: realm-management.view-users
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:h2:file:./data/kc-mcp-extensions
      KC_MCP_STORAGE_SECRET_KEY: demo-storage-key-change-me
    volumes:
      # the extension jar; the image reads /deployments/providers (KC_MCP_PROVIDERS_DIR)
      - ./target/acme-keycloak-mcp-extensions-1.0-SNAPSHOT.jar:/deployments/providers/acme-extensions.jar:ro
    ports:
      - "8094:8081"
    depends_on:
      keycloak:
        condition: service_healthy
