# Two tenants on one Keycloak: tenant-a owns realm-a-1 and realm-a-2, tenant-b owns realm-b-1. The onboarding job
# gives each tenant a `keycloak-mcp-server-<tenant>` client in master (Signed JWT, public key fetched from the MCP
# server at /auth/keys/<tenant>/jwks.json) with realm-admin on the tenant's realms. The MCP server knows the
# tenants from systems.json and answers at one MCP entry per tenant or realm. For the user login (mcp-users) the
# same client exists in each of the tenant's realms, without admin roles, and may act for the realm's users
# (token exchange delegation). See README.md.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # token exchange delegation (preview in 26.8) for mcp-users. 26.8 warns about its deprecated defaults: use
      # the v2 brokering API, drop the Twitter (OAuth 1.0a) broker
      KC_FEATURES: token-exchange-delegation,parameterized-scopes,identity-brokering-api:v2
      KC_FEATURES_DISABLED: twitter-broker
    ports:
      - "127.0.0.1:8090:8080"
      - "9090:9000"
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.8.2
    entrypoint: ["/bin/bash", "/onboard-tenants.sh"]
    volumes:
      - ./init/onboard-tenants.sh:/onboard-tenants.sh:ro
      - ./init/grant-delegation.sh:/grant-delegation.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy

  mcp:
    build:
      context: ../..
      dockerfile: modules/backend/src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_HTTP_HOST: 0.0.0.0
      # systems come from systems.json only; no static system
      KC_MCP_STATIC_SYSTEMS: "false"
      KC_MCP_DYNAMIC_SYSTEMS: "true"
      KC_MCP_SYSTEMS_FILE: /config/systems.json
      # the MCP server may only talk to this Keycloak
      KC_MCP_ALLOWED_HOSTS: keycloak:8080
      # provisioned private_key_jwt keys, one per tenant (./gen-keys.sh), read-only
      KC_MCP_KEYS_DIR: /deployments/data/keys
      KC_MCP_TOOL_EXPOSURE: hybrid
      KC_MCP_STARTUP_CHECK: warn
      # the management UI, to look around: http://localhost:8091/ui/ (admin / admin of the master realm), with the
      # tenants as systems, their realms and the audit trail of the tool calls. It needs the database storage, here
      # an H2 file in the container, and HTTPS, which dev mode lifts (its session cookie drops Secure; for one
      # person's machine only). The systems still come from systems.json. docs/management-ui.md
      KC_MCP_UI_ENABLED: "true"
      KC_MCP_DEV_MODE: "true"
      KC_MCP_UI_OIDC_ISSUER: http://keycloak:8080/realms/master
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:h2:file:./data/kc-mcp-multi-tenant
      KC_MCP_STORAGE_SECRET_KEY: demo-storage-key-change-me
      # with a database the keys would come from its vault; the tenants' keys are the provisioned ones in keys/,
      # which the second server signs with as well
      KC_MCP_SPI_KEY_VAULT_DB_ENABLED: "false"
    volumes:
      - ./systems.json:/config/systems.json:ro
      - ./keys:/deployments/data/keys:ro
    ports:
      - "8091:8081"
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully

  # The same server with user login: the MCP endpoint requires an OAuth login, and every Admin API call is made with
  # a delegated token Keycloak issues for the user and the tenant's client together (token exchange delegation:
  # sub = the user, act = keycloak-mcp-server-<tenant>). A realm entry logs its users in at that realm, and the
  # exchange happens there: the tenant's client exists in each of its realms with the same key as in master.
  mcp-users:
    build:
      context: ../..
      dockerfile: modules/backend/src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_HTTP_HOST: 0.0.0.0
      KC_MCP_STATIC_SYSTEMS: "false"
      KC_MCP_DYNAMIC_SYSTEMS: "true"
      KC_MCP_SYSTEMS_FILE: /config/systems.json
      KC_MCP_ALLOWED_HOSTS: keycloak:8080
      KC_MCP_KEYS_DIR: /deployments/data/keys
      KC_MCP_TOOL_EXPOSURE: hybrid
      KC_MCP_STARTUP_CHECK: "off"
      # callers act with their own roles; the default OIDC tenant (root /mcp) is the master realm,
      # an entry /mcp/systems/<tenant>/<realm> verifies tokens of that realm and tells MCP clients to ask for the
      # scope delegation:client:keycloak-mcp-server-<tenant>
      KC_MCP_DELEGATION: exchange
      KC_MCP_SYSTEMS_DEFAULT_URL: http://keycloak:8080
      KC_MCP_SYSTEMS_DEFAULT_AUTH_REALM: master
      KC_MCP_MCP_OAUTH_ENABLED: "true"
      # only tokens minted for the MCP server (audience mapper on mcp-consumer)
      KC_MCP_MCP_OAUTH_AUDIENCE: keycloak-mcp-server
    volumes:
      - ./systems.json:/config/systems.json:ro
      - ./keys:/deployments/data/keys:ro
    ports:
      - "8092:8081"
    depends_on:
      # Keycloak fetches the tenants' public keys from the first server (the clients' JWKS URL)
      mcp:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully

