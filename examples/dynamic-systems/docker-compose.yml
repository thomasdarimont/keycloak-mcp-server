# Dynamic systems with a database: the MCP server starts with no Keycloak system at all. ./demo.sh then registers
# the system "acme" through the admin API (stored in PostgreSQL, key pair generated in the database vault), creates
# the realm acme-dev with the public mcp-consumer client and demo users, creates the keycloak-mcp-server client in
# that realm with the JWKS URL the API answered, lets it act for the realm's users, and calls tools as service
# account and as users. A second Keycloak (keycloak-globex, :8089) stands for another company's: demo.sh registers
# it as the system "globex" and adopts two of its four realms, the others are left for the management UI's Adopt tab.
# Both MCP containers share the database, so a system registered once is known to both. See README.md.
#
#   ../../mvnw -f ../../pom.xml package -DskipTests -Ppostgresql    # the PostgreSQL build of the server
#   docker compose up -d --build && ./demo.sh
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5490:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2-3
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # token exchange delegation (the user login of mcp-users) needs parameterized scopes, both preview.
      # 26.8 warns about its deprecated defaults: use the v2 brokering API, drop the Twitter (OAuth 1.0a) broker
      KC_FEATURES: token-exchange-delegation,parameterized-scopes,identity-brokering-api:v2
      KC_FEATURES_DISABLED: twitter-broker
    ports:
      - "127.0.0.1:8090:8080"
      - "9090:9000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The management UI's client keycloak-mcp-ui in the master realm, which a realm import cannot create there. A
  # one-shot job, so the UI can sign people in before demo.sh has run.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.8.2-3
    entrypoint: ["/bin/bash", "/ui-client.sh"]
    volumes:
      - ./init/ui-client.sh:/ui-client.sh:ro
      - ./clients/keycloak-mcp-ui.json:/keycloak-mcp-ui.json:ro
    depends_on:
      keycloak:
        condition: service_healthy

  # A second Keycloak, another company's: it comes with four realms (realms-globex/) and nothing of the MCP server
  # in it. demo.sh registers it as the system "globex", creates the server's client with the generated setup script
  # and adopts two of its realms; the others are left for the Adopt tab of the management UI. Its data lives in the
  # container: docker compose down throws it away, the next up imports the four realms again.
  keycloak-globex:
    image: quay.io/keycloak/keycloak:26.8.2-3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8089
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: identity-brokering-api:v2
      KC_FEATURES_DISABLED: twitter-broker
    volumes:
      - ./realms-globex:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The control-plane facing server: admin API on, acts with the registered system's service account.
  mcp:
    build:
      context: ../..
      dockerfile: modules/backend/src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_HTTP_HOST: 0.0.0.0
      # database storage: systems, keys and audit events (the PostgreSQL build of the server)
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/kcmcp
      QUARKUS_DATASOURCE_USERNAME: kcmcp
      QUARKUS_DATASOURCE_PASSWORD: kcmcp
      KC_MCP_STORAGE_SECRET_KEY: demo-storage-key-change-me
      # audit rows older than 30 days are deleted (at startup, then hourly); one server doing it is enough
      KC_MCP_SPI_AUDIT_LISTENER_DB_RETENTION_DAYS: "30"
      # systems come from the database only, registered through the admin API
      KC_MCP_STATIC_SYSTEMS: "false"
      KC_MCP_DYNAMIC_SYSTEMS: "true"
      KC_MCP_ADMIN_ENABLED: "true"
      # automation uses the static token, people an access token of a master realm admin (role "admin")
      KC_MCP_ADMIN_TOKEN: demo-admin-token
      KC_MCP_ADMIN_OAUTH_ISSUER: http://keycloak:8080/realms/master
      # only tokens minted for the MCP server (the public client keycloak-mcp-admin); admin-cli tokens are lightweight
      # in Keycloak 26 and carry neither roles nor an audience
      KC_MCP_ADMIN_OAUTH_AUDIENCE: keycloak-mcp-server
      # the management UI: http://localhost:8091/ui/ (admin / admin; the job keycloak-init creates its client
      # keycloak-mcp-ui in master), signing people in at the realm of KC_MCP_ADMIN_OAUTH_ISSUER. Dev mode lets it run
      # without HTTPS (its session cookie drops Secure; for one person's machine only). docs/management-ui.md
      KC_MCP_UI_ENABLED: "true"
      KC_MCP_DEV_MODE: "true"
      # the MCP server may only talk to these two Keycloaks
      KC_MCP_ALLOWED_HOSTS: keycloak:8080,keycloak-globex:8080
      KC_MCP_TOOLS_EXPOSURE: hybrid
      KC_MCP_STARTUP_CHECK: "off"
    ports:
      - "8091:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # The same server for people: the MCP endpoint requires a login at the entry's realm, the user consents to the
  # system's client acting on their behalf, and every call runs with the delegated token Keycloak exchanges the
  # user's token for (sub = the user, act = keycloak-mcp-server). Same database, so it knows the registered
  # systems too, and signs its token requests with the same key.
  mcp-users:
    build:
      context: ../..
      dockerfile: modules/backend/src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/kcmcp
      QUARKUS_DATASOURCE_USERNAME: kcmcp
      QUARKUS_DATASOURCE_PASSWORD: kcmcp
      KC_MCP_STORAGE_SECRET_KEY: demo-storage-key-change-me
      KC_MCP_STATIC_SYSTEMS: "false"
      KC_MCP_DYNAMIC_SYSTEMS: "true"
      KC_MCP_ALLOWED_HOSTS: keycloak:8080,keycloak-globex:8080
      KC_MCP_TOOLS_EXPOSURE: hybrid
      KC_MCP_STARTUP_CHECK: "off"
      KC_MCP_MCP_DELEGATION: exchange
      # the default OIDC tenant (root /mcp) is the master realm; an entry /mcp/systems/<system>[/<realm>] verifies
      # tokens of that system's realm and asks for the scope delegation:client:<the system's client>
      KC_MCP_SYSTEMS_DEFAULT_URL: http://keycloak:8080
      KC_MCP_SYSTEMS_DEFAULT_AUTH_REALM: master
      KC_MCP_MCP_OAUTH_ENABLED: "true"
      # only tokens minted for the MCP server (audience mapper on mcp-consumer, and the delegation scope)
      KC_MCP_MCP_OAUTH_AUDIENCE: keycloak-mcp-server
      # personal data stays out of the console log; the database rows keep the full record
      KC_MCP_SPI_AUDIT_SCRUBBER_PII_MODE: pseudonymize
      KC_MCP_SPI_AUDIT_SCRUBBER_PII_TARGETS: console
    ports:
      - "8092:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  pgdata:
